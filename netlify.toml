# Netlify build settings. Pages are pre-rendered by React Router into build/client.
[build]
  command = "npm run build"
  publish = "build/client"

# Long-lived caching for fingerprinted assets.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The work pages moved to /portfolio; keep old links working.
[[redirects]]
  from = "/work"
  to = "/portfolio"
  status = 301

[[redirects]]
  from = "/work/portfolio"
  to = "/portfolio/foti-ceci"
  status = 301

[[redirects]]
  from = "/work/*"
  to = "/portfolio/:splat"
  status = 301

[[redirects]]
  from = "/packages"
  to = "/pricing"
  status = 301
